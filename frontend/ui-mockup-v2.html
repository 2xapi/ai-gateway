<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>方案 D — 极简</title>
<style>
:root{--bg:#000;--card:#16191f;--card-hover:#1c2028;--border:#22262e;--text:#f0f2f6;--muted:#6b7280;--blue:#5b8def;--green:#34d399;--orange:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,"SF Pro Display","PingFang SC",sans-serif;display:flex;justify-content:center;min-height:100vh;padding:40px 20px}
.wrap{width:100%;max-width:520px}

/* 标题 */
.header{text-align:center;margin-bottom:32px}
.header h1{font-size:22px;font-weight:700;letter-spacing:-.02em}
.header .sub{font-size:13px;color:var(--muted);margin-top:4px}

/* 分区标签 */
.label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:20px 0 10px 12px}

/* 卡片 */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:8px;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:14px}
.card:hover{background:var(--card-hover);border-color:#2d3240}
.card.active{background:linear-gradient(135deg,rgba(91,141,239,.08),rgba(91,141,239,.02));border-color:rgba(91,141,239,.3)}
.card .icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.card .icon.ds{background:rgba(91,141,239,.15)} .card .icon.ai{background:rgba(52,211,153,.12)} .card .icon.zp{background:rgba(251,191,36,.12)}
.card .info{flex:1;min-width:0}
.card .info .name{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.card .info .meta{font-size:12px;color:var(--muted);margin-top:2px}
.card .mode{font-size:10px;padding:3px 10px;border-radius:999px;font-weight:600;flex-shrink:0}
.mode.mixed{background:rgba(91,141,239,.15);color:var(--blue)}
.mode.official{background:rgba(52,211,153,.12);color:var(--green)}
.mode.pure{background:rgba(251,191,36,.12);color:var(--orange)}
.card .star{color:var(--blue);font-size:14px}
.card .arrow{color:var(--muted);font-size:14px;transition:.15s}
.card:hover .arrow{color:var(--text);transform:translateX(3px)}

/* 激活状态行 */
.active-bar{background:rgba(52,211,153,.06);border:1px solid rgba(52,211,153,.15);border-radius:14px;padding:14px 20px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between}
.active-bar .left{display:flex;align-items:center;gap:8px}
.active-bar .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(52,211,153,.5)}
.active-bar .txt{font-size:13px}
.active-bar .txt b{font-weight:600}
.active-bar .txt .dim{color:var(--muted)}
.active-bar .switch{font-size:12px;color:var(--blue);cursor:pointer;padding:6px 14px;border:1px solid rgba(91,141,239,.3);border-radius:8px}

/* 新建按钮 */
.add{border:1.5px dashed var(--border);border-radius:14px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;font-size:14px;transition:.2s}
.add:hover{border-color:var(--blue);color:var(--blue);background:rgba(91,141,239,.04)}

/* 底部工具栏 */
.toolbar{display:flex;gap:0;margin-top:28px;border-top:1px solid var(--border);padding-top:16px}
.toolbar .tool{flex:1;text-align:center;font-size:12px;color:var(--muted);cursor:pointer;padding:8px;border-radius:8px;transition:.15s}
.toolbar .tool:hover{color:var(--text);background:var(--card)}
.toolbar .tool .ico{font-size:18px;display:block;margin-bottom:2px}
</style></head>
<body>
<div class="wrap">
  <div class="header">
    <h1>2xapi Codex Console</h1>
    <div class="sub">模型供应商管理</div>
  </div>

  <div class="active-bar">
    <div class="left">
      <span class="dot"></span>
      <span class="txt"><b>DeepSeek</b> <span class="dim">· Mixed · deepseek-chat</span></span>
    </div>
    <span class="switch">⇄ 切官方</span>
  </div>

  <div class="label">供应商</div>

  <div class="card active">
    <div class="icon ds">🧠</div>
    <div class="info">
      <div class="name"><span class="star">★</span> DeepSeek</div>
      <div class="meta">ChatCompletions · 2 个模型 · ctx 64K</div>
    </div>
    <span class="mode mixed">Mixed</span>
    <span class="arrow">›</span>
  </div>

  <div class="card">
    <div class="icon ai">✨</div>
    <div class="info">
      <div class="name">OpenAI</div>
      <div class="meta">Responses · gpt-4o · 官方直连</div>
    </div>
    <span class="mode official">Official</span>
    <span class="arrow">›</span>
  </div>

  <div class="card">
    <div class="icon zp">🔮</div>
    <div class="info">
      <div class="name">智谱</div>
      <div class="meta">Responses · glm-5.2 · 3 个模型</div>
    </div>
    <span class="mode pure">PureApi</span>
    <span class="arrow">›</span>
  </div>

  <div class="add" style="margin-top:8px">+ 添加供应商</div>

  <div class="toolbar">
    <div class="tool"><span class="ico">🛠</span>工具箱</div>
    <div class="tool"><span class="ico">↻</span>刷新</div>
    <div class="tool"><span class="ico">⚙️</span>设置</div>
  </div>
</div>
</body></html>
